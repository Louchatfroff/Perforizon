name: perm-test
on: workflow_dispatch
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST repos/${{ github.repository }}/labels -f name=upstream-sync -f color=ededed || true
          gh api -X POST repos/${{ github.repository }}/issues -f title="permission test" -f body="delete me" || true
          gh api repos/${{ github.repository }}/issues --jq 'length' || true
